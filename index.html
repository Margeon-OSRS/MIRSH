<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>MIRSH/70 - DOMINION OF MANDA'LOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --fg: #3dff7a;
    --bg: #050a06;
    --dim: #1d7a3f;
    --accent: #b7ffd0;
    --paper-bg: #f4efe2;
    --paper-fg: #1a1a1a;
    --paper-band: #d8ead8;
    --font: 'VT323', 'IBM Plex Mono', Consolas, 'Courier New', ui-monospace, monospace;
  }
  [data-theme="AMBER"] {
    --fg: #ffb000;
    --bg: #0a0700;
    --dim: #8a6200;
    --accent: #ffd98a;
  }
  [data-theme="PAPER"] {
    --fg: #1a1a1a;
    --bg: #f1ead6;
    --dim: #6b6350;
    --accent: #000000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 19px;
    line-height: 1.25;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  #hdr {
    flex: none;
    border-bottom: 1px solid var(--dim);
    padding: 3px 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 1px;
  }
  #main { flex: 1; display: flex; min-height: 0; }
  #term { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #out {
    flex: 1;
    overflow-y: auto;
    padding: 6px 8px 2px 8px;
    overscroll-behavior: contain;
  }
  #out div { white-space: pre-wrap; word-break: break-word; min-height: 1.25em; }
  #out .echo { color: var(--accent); }
  #out .err { color: var(--fg); text-decoration: underline; }
  #notice { flex: none; padding: 0 8px; color: var(--accent); }
  #inrow {
    flex: none;
    display: flex;
    align-items: baseline;
    padding: 2px 8px 6px 8px;
    position: relative;
  }
  #prompt { flex: none; padding-right: 8px; }
  #inwrap { position: relative; flex: 1; }
  #in {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--accent);
    font: inherit;
    letter-spacing: inherit;
    caret-color: transparent;
    padding: 0;
  }
  #cursor {
    position: absolute;
    top: 0;
    left: 0;
    width: 0.6em;
    height: 1.2em;
    background: var(--fg);
    pointer-events: none;
    animation: blink 1.06s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    #cursor { animation: none; }
  }
  /* CRT overlay */
  #crt {
    display: none;
    pointer-events: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.18) 3px
    );
  }
  body.crt #crt { display: block; }
  body.crt #out, body.crt #hdr, body.crt #inrow {
    text-shadow: 0 0 6px color-mix(in srgb, var(--fg) 55%, transparent);
  }
  @media (prefers-reduced-motion: reduce) {
    body.crt #crt { display: none; }
    body.crt #out, body.crt #hdr, body.crt #inrow { text-shadow: none; }
  }
  /* Spool pane: fanfold line printer paper */
  #spool {
    display: none;
    flex: none;
    width: 46%;
    min-width: 380px;
    border-left: 2px solid var(--dim);
    background: #565a52;
    flex-direction: column;
    min-height: 0;
  }
  body.spool-open #spool { display: flex; }
  #spoolbar {
    flex: none;
    padding: 4px 8px;
    color: #e8e8dd;
    background: #3c4038;
    display: flex;
    gap: 16px;
  }
  #spoolbar button {
    background: none;
    border: 1px solid #e8e8dd;
    color: #e8e8dd;
    font: inherit;
    padding: 0 10px;
    cursor: pointer;
  }
  #spoolscroll { flex: 1; overflow: auto; padding: 12px; }
  #paper {
    background: var(--paper-bg);
    color: var(--paper-fg);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.2;
    width: -moz-max-content;
    width: max-content;
    min-width: 100%;
    padding: 10px 40px;
    position: relative;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  #paper::before, #paper::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 26px;
    background-image: radial-gradient(circle at 13px 12px, #565a52 5px, transparent 6px);
    background-size: 26px 24px;
    border-right: 1px dashed #b9b29c;
  }
  #paper::before { left: 0; }
  #paper::after { right: 0; border-right: none; border-left: 1px dashed #b9b29c; }
  #paper div { white-space: pre; }
  body.greenbar #paper div.band { background: var(--paper-band); }
  #spoolempty { color: #d8d8cc; padding: 16px; }
  /* Narrow screens: spool takes the full screen */
  @media (max-width: 900px) {
    body.spool-open #term { display: none; }
    #spool { width: 100%; min-width: 0; border-left: none; }
  }
  /* Overlay dialogs (EXPORT / IMPORT) */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.72);
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  #overlay.open { display: flex; }
  #dialog {
    background: var(--bg);
    color: var(--fg);
    border: 2px solid var(--fg);
    padding: 12px;
    width: min(720px, 96vw);
    max-height: 90dvh;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #dialog textarea {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--dim);
    font: inherit;
    font-size: 14px;
    width: 100%;
    height: 40dvh;
    resize: none;
  }
  #dialog .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #dialog button, #dialog label.filebtn {
    background: none;
    border: 1px solid var(--fg);
    color: var(--fg);
    font: inherit;
    padding: 2px 12px;
    cursor: pointer;
  }
  #dialog input[type=file] { display: none; }
  /* Print: the report only, no terminal */
  @media print {
    body { background: #fff; }
    #term, #hdr, #spoolbar, #crt, #overlay, #notice { display: none !important; }
    #app, #main, #spool, #spoolscroll { display: block !important; overflow: visible !important; height: auto !important; width: auto !important; }
    #spool { border: none; background: #fff; }
    #spoolscroll { padding: 0; }
    #paper { box-shadow: none; padding: 0; width: auto; min-width: 0; color: #000; background: #fff; font-size: 11px; }
    #paper::before, #paper::after { display: none; }
    body.greenbar #paper div.band { background: #eef3ee; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body data-theme="GREEN">
<div id="app">
  <div id="hdr">MIRSH/70</div>
  <div id="main">
    <div id="term">
      <div id="out" role="log" aria-live="polite" aria-label="console output"></div>
      <div id="notice"></div>
      <div id="inrow">
        <span id="prompt">&gt;</span>
        <span id="inwrap">
          <input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                 aria-label="command input" />
          <span id="cursor" aria-hidden="true"></span>
        </span>
      </div>
    </div>
    <div id="spool" aria-label="line printer spool">
      <div id="spoolbar">
        <button id="spoolreturn" type="button">RETURN</button>
        <button id="spoolprint" type="button">PRINT / PDF</button>
        <span id="spooltitle"></span>
      </div>
      <div id="spoolscroll">
        <div id="spoolempty">SPOOL EMPTY. PRINT A REPORT WITH: PRINT &lt;REPORT&gt;</div>
        <div id="paper" hidden></div>
      </div>
    </div>
  </div>
</div>
<div id="crt" aria-hidden="true"></div>
<div id="overlay">
  <div id="dialog" role="dialog" aria-modal="true">
    <div id="dlgtitle">EXPORT</div>
    <textarea id="dlgtext" spellcheck="false" aria-label="document JSON"></textarea>
    <div class="row" id="dlgbtns"></div>
  </div>
</div>
<script src="engine.js"></script>
<script src="engine.test.js"></script>
<script>
(function () {
  'use strict';
  var E = window.Engine;
  var $ = function (id) { return document.getElementById(id); };
  var outEl = $('out'), inEl = $('in'), hdrEl = $('hdr'), promptEl = $('prompt'),
      cursorEl = $('cursor'), noticeEl = $('notice'), paperEl = $('paper');

  /* ---------------- Storage layer ----------------
     The only object in the whole codebase that touches localStorage.
     Swap this object for a Supabase adapter later; the engine and UI
     only ever call load/save/snapshot/listSnapshots/restore. */
  var Store = (function () {
    var KEY = E.STORAGE_KEY;               // 'mandalor-mirsh-v1'
    var SNAP_KEY = KEY + ':snapshots';
    var UI_KEY = KEY + ':ui';
    var ok = false;
    try {
      var t = '__mirsh_test__';
      localStorage.setItem(t, '1');
      localStorage.removeItem(t);
      ok = true;
    } catch (e) { ok = false; }
    function read(k) {
      if (!ok) return null;
      try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }
      catch (e) { return null; }
    }
    function write(k, v) {
      if (!ok) return false;
      try { localStorage.setItem(k, JSON.stringify(v)); return true; }
      catch (e) { return false; }
    }
    return {
      available: ok,
      load: function () {
        var raw = read(KEY);
        return raw ? E.migrate(raw) : null;
      },
      save: function (doc) { return write(KEY, doc); },
      snapshot: function (doc, nowIso) {
        var snaps = read(SNAP_KEY) || [];
        snaps.push({ ts: nowIso, doc: doc });
        while (snaps.length > 5) snaps.shift();
        while (snaps.length > 0 && !write(SNAP_KEY, snaps)) snaps.shift(); // space permitting
        return { ok: snaps.length > 0, kept: snaps.length };
      },
      listSnapshots: function () {
        var snaps = read(SNAP_KEY) || [];
        return snaps.map(function (s, i) {
          return {
            n: i + 1, ts: s.ts,
            citizens: (s.doc.citizens || []).length,
            ledger: (s.doc.ledger || []).length
          };
        });
      },
      restore: function (n) {
        var snaps = read(SNAP_KEY) || [];
        var s = snaps[n - 1];
        return s ? E.migrate(JSON.parse(JSON.stringify(s.doc))) : null;
      },
      loadUi: function () { return read(UI_KEY) || {}; },
      saveUi: function (p) { return write(UI_KEY, p); }
    };
  })();

  /* ---------------- State ---------------- */
  var S = {
    doc: null,
    operator: null,
    pending: null,          // {kind:'engine', line} | {kind:'custom', onYes}
    menu: null,             // menu navigation state
    fields: null,           // field-prompt state
    history: [],
    histIdx: -1,
    histDraft: '',
    saveTime: null,
    booting: true,
    audio: null
  };

  function ctx(confirmed) {
    return { now: new Date().toISOString(), operator: S.operator, confirmed: !!confirmed };
  }

  /* ---------------- Output (with baud pacing) ---------------- */
  var queue = [];           // [{text, cls}]
  var pacing = false;
  var paceTimer = null;

  function cps() {
    var b = S.doc ? S.doc.settings.baud : 'OFF';
    if (b === 'OFF') return 0;
    return Math.max(10, parseInt(b, 10) / 10);
  }

  function addLine(text, cls) {
    var d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = text;
    outEl.appendChild(d);
    while (outEl.childNodes.length > 4000) outEl.removeChild(outEl.firstChild);
    outEl.scrollTop = outEl.scrollHeight;
    return d;
  }

  function print(text, cls) {
    var rate = cps();
    if (rate === 0 && !pacing) { addLine(text, cls); return; }
    queue.push({ text: text, cls: cls });
    if (!pacing) startPacing();
  }

  function startPacing() {
    pacing = true;
    var current = null, pos = 0, el = null;
    var rate = cps() || 1000;
    var interval = Math.max(4, Math.round(1000 / rate));
    function step() {
      if (!pacing) return;
      if (!current) {
        current = queue.shift();
        if (!current) { stopPacing(); return; }
        el = addLine('', current.cls);
        pos = 0;
      }
      var chunk = Math.max(1, Math.round(rate / (1000 / interval) / 1));
      pos += chunk;
      el.textContent = current.text.slice(0, pos);
      outEl.scrollTop = outEl.scrollHeight;
      if (pos >= current.text.length) { current = null; }
      paceTimer = setTimeout(step, interval);
    }
    step();
  }

  function stopPacing() {
    pacing = false;
    if (paceTimer) { clearTimeout(paceTimer); paceTimer = null; }
  }

  function flushPacing() {
    if (!pacing && queue.length === 0) return;
    stopPacing();
    // finish the partly printed line, then dump the rest instantly
    var last = outEl.lastChild;
    if (last && queue.length >= 0) { /* partial line text is replaced below if needed */ }
    while (queue.length > 0) {
      var q = queue.shift();
      addLine(q.text, q.cls);
    }
  }

  function ready() {
    var p = (S.doc && S.doc.settings.prompt) || 'READY';
    print(p);
    updateHeader();
    focusInput();
  }

  function focusInput() { inEl.focus({ preventScroll: true }); moveCursor(); }

  /* ---------------- Header ---------------- */
  function updateHeader() {
    if (!S.doc) return;
    var open = S.doc.jobs.filter(function (j) {
      return j.status === 'OPEN' || j.status === 'CLAIMED' || j.status === 'SUBMITTED';
    }).length;
    var save = Store.available ? (S.saveTime ? 'SAVED ' + S.saveTime : 'UNSAVED') : 'UNSAVED';
    hdrEl.textContent = S.doc.settings.systemName +
      '  OP:' + (S.operator ? S.operator.toUpperCase() : '----') +
      '  ' + S.doc.settings.theme +
      '  ' + save +
      '  CIT:' + S.doc.citizens.length +
      ' LDG:' + S.doc.ledger.length +
      ' JOB:' + open;
  }

  function autosave() {
    if (Store.available && Store.save(S.doc)) {
      var d = new Date();
      S.saveTime = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    } else {
      S.saveTime = null;
    }
    updateHeader();
  }

  /* ---------------- Display settings ---------------- */
  function applyDisplay() {
    var s = S.doc.settings;
    document.body.setAttribute('data-theme', s.theme);
    document.body.classList.toggle('crt', !!s.crt &&
      !window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    document.body.classList.toggle('greenbar', !!s.greenbar);
    updateHeader();
  }

  /* ---------------- Sound ---------------- */
  function click() {
    if (!S.doc || !S.doc.settings.sound) return;
    try {
      if (!S.audio) S.audio = new (window.AudioContext || window.webkitAudioContext)();
      var a = S.audio;
      if (a.state === 'suspended') a.resume();
      var o = a.createOscillator(), g = a.createGain();
      o.type = 'square';
      o.frequency.value = 620;
      g.gain.setValueAtTime(0.03, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.03);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + 0.035);
    } catch (e) { /* sound is best-effort */ }
  }

  /* ---------------- Spool pane ---------------- */
  function renderSpool(report) {
    paperEl.textContent = '';
    $('spoolempty').hidden = true;
    paperEl.hidden = false;
    $('spooltitle').textContent = report.title || '';
    report.lines.forEach(function (line, i) {
      var d = document.createElement('div');
      d.textContent = line.length ? line : ' ';
      if (Math.floor(i / 3) % 2 === 1) d.className = 'band';
      paperEl.appendChild(d);
    });
    document.body.classList.add('spool-open');
    $('spoolscroll').scrollTop = 0;
  }
  $('spoolreturn').addEventListener('click', function () {
    document.body.classList.remove('spool-open');
    focusInput();
  });
  $('spoolprint').addEventListener('click', function () { window.print(); });

  /* ---------------- Overlay dialogs ---------------- */
  function closeDialog() {
    $('overlay').classList.remove('open');
    $('dlgbtns').textContent = '';
    focusInput();
  }
  function dlgButton(label, fn) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.addEventListener('click', fn);
    $('dlgbtns').appendChild(b);
    return b;
  }

  function showExport(filename) {
    var json = JSON.stringify(S.doc, null, 1);
    $('dlgtitle').textContent = 'EXPORT DATASET - ' + filename.toUpperCase();
    $('dlgtext').value = json;
    $('dlgtext').readOnly = true;
    $('dlgbtns').textContent = '';
    dlgButton('COPY', function () {
      $('dlgtext').select();
      try { document.execCommand('copy'); } catch (e) {}
      if (navigator.clipboard) navigator.clipboard.writeText(json).catch(function () {});
    });
    dlgButton('DOWNLOAD', function () {
      var blob = new Blob([json], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    });
    dlgButton('CLOSE', closeDialog);
    $('overlay').classList.add('open');
    // auto-download once
    var blob = new Blob([json], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function showImport(merge) {
    $('dlgtitle').textContent = merge ? 'IMPORT --MERGE (ADDS UNKNOWN IDS ONLY)' : 'IMPORT (OVERWRITES CURRENT DATASET)';
    $('dlgtext').value = '';
    $('dlgtext').readOnly = false;
    $('dlgbtns').textContent = '';
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.json,application/json';
    var fileLabel = document.createElement('label');
    fileLabel.className = 'filebtn';
    fileLabel.textContent = 'CHOOSE FILE';
    fileLabel.appendChild(fileInput);
    $('dlgbtns').appendChild(fileLabel);
    fileInput.addEventListener('change', function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () { $('dlgtext').value = String(r.result); };
      r.readAsText(f);
    });
    dlgButton('VALIDATE AND IMPORT', function () {
      var text = $('dlgtext').value;
      var v = E.validateImport(text);
      if (!v.ok) { closeDialog(); print('ERR 0016 IMPORT REJECTED. ' + v.error, 'err'); ready(); return; }
      closeDialog();
      print('IMPORT VALIDATED: ' + v.counts.citizens + ' CITIZENS, ' + v.counts.ledger +
        ' LEDGER LINES, ' + v.counts.jobs + ' JOBS, ' + v.counts.vault + ' VAULT ITEMS.');
      print(merge ? 'MERGE: RECORDS WITH UNKNOWN IDS WILL BE ADDED.' : 'CURRENT DATASET WILL BE OVERWRITTEN.');
      print('CONFIRM? (Y/N)');
      S.pending = {
        kind: 'custom',
        onYes: function () {
          if (merge) {
            var added = E.mergeImport(S.doc, v.doc);
            print('MERGED: +' + added.citizens + ' CITIZENS, +' + added.ledger + ' LEDGER, +' +
              added.jobs + ' JOBS, +' + added.vault + ' VAULT, +' + added.recruits + ' RECRUITS, +' +
              added.housing + ' HOUSING, +' + added.positions + ' POSITIONS, +' + added.notices + ' NOTICES.');
          } else {
            S.doc = v.doc;
            print('DATASET REPLACED.');
          }
          autosave();
          applyDisplay();
          ready();
        }
      };
      focusInput();
    });
    dlgButton('CANCEL', function () { closeDialog(); print('CANCELLED.'); ready(); });
    $('overlay').classList.add('open');
    $('dlgtext').focus();
  }

  /* ---------------- Effects from the engine ---------------- */
  function handleEffects(effects) {
    effects.forEach(function (e) {
      switch (e.type) {
        case 'logon': S.operator = e.operator; break;
        case 'logoff': S.operator = null; break;
        case 'cls': outEl.textContent = ''; break;
        case 'menu': enterMenu(); break;
        case 'display': applyDisplay(); break;
        case 'spool-toggle':
          document.body.classList.toggle('spool-open');
          break;
        case 'export': showExport(e.filename); break;
        case 'import': showImport(e.merge); break;
        case 'snapshot': {
          var r = Store.available ? Store.snapshot(S.doc, new Date().toISOString()) : { ok: false };
          if (r.ok) print('SNAPSHOT STORED. ' + r.kept + ' OF 5 SLOTS IN USE. RESTORE <N> TO LOAD.');
          else print('ERR 0013 SNAPSHOT FAILED. NO LOCAL STORAGE OR NO SPACE.', 'err');
          break;
        }
        case 'snapshot-list': {
          var list = Store.listSnapshots();
          if (list.length === 0) { print('NO SNAPSHOTS.'); break; }
          list.forEach(function (s) {
            print('  ' + s.n + '  ' + E.fmtLocal(s.ts) + '  CIT:' + s.citizens + ' LDG:' + s.ledger);
          });
          break;
        }
        case 'restore': {
          var snaps = Store.listSnapshots();
          var s = snaps[e.n - 1];
          if (!s) { print('ERR 0005 NO SNAPSHOT ' + e.n + '. TYPE SNAPSHOT LIST.', 'err'); break; }
          print('RESTORE SNAPSHOT ' + e.n + ' (' + E.fmtLocal(s.ts) + ', CIT:' + s.citizens +
            ' LDG:' + s.ledger + ') OVERWRITES CURRENT DATA.');
          print('CONFIRM? (Y/N)');
          S.pending = {
            kind: 'custom',
            onYes: function () {
              S.doc = Store.restore(e.n);
              autosave();
              applyDisplay();
              print('RESTORED SNAPSHOT ' + e.n + '.');
              ready();
            }
          };
          break;
        }
        case 'selftest': {
          if (!window.MirshTests) { print('ERR 0017 TEST SUITE NOT LOADED.', 'err'); break; }
          var res = window.MirshTests.run();
          print('SELFTEST: ' + res.pass + ' PASS, ' + res.fail + ' FAIL, ' + (res.pass + res.fail) + ' TOTAL.');
          res.failures.slice(0, 20).forEach(function (f) {
            print('  FAIL ' + f.name + ': ' + f.error, 'err');
          });
          break;
        }
      }
    });
  }

  /* ---------------- Command execution ---------------- */
  function runLine(line, opts) {
    opts = opts || {};
    if (!opts.noEcho) print('> ' + line, 'echo');
    var res = E.execute(S.doc, line, ctx(!!opts.confirmed));
    if (res.pending) {
      res.lines.forEach(function (l) { print(l); });
      S.pending = { kind: 'engine', line: res.pending.line };
      focusInput();
      return;
    }
    S.doc = res.doc;
    handleEffects(res.effects);
    res.lines.forEach(function (l) {
      print(l, l.indexOf('ERR ') === 0 || l.indexOf('ABEND') === 0 ? 'err' : undefined);
    });
    if (res.spool) renderSpool(res.spool);
    autosave();
    ready();
  }

  /* ---------------- Menus ---------------- */
  function enterMenu() {
    S.menu = { spec: E.menuSpec(S.doc), level: 'modules', mod: null };
    print('SELECT MODULE');
    S.menu.spec.forEach(function (m, i) {
      print('  ' + (i + 1) + '  ' + m.title);
    });
    print('TYPE A NUMBER. A LONE PERIOD CANCELS.');
  }

  function menuInput(text) {
    var t = text.trim();
    if (t === '.' || t === '') {
      S.menu = null;
      print('MENU CLOSED.');
      ready();
      return;
    }
    var n = parseInt(t, 10);
    if (S.menu.level === 'modules') {
      var mod = S.menu.spec[n - 1];
      if (!mod) { print('ERR 0004 NO MENU ITEM "' + t + '".', 'err'); print('TYPE A NUMBER. A LONE PERIOD CANCELS.'); return; }
      S.menu.mod = mod;
      S.menu.level = 'actions';
      print(mod.title + ' - SELECT ACTION');
      mod.actions.forEach(function (a, i) {
        print('  ' + (i + 1) + '  ' + (a.name + '        ').slice(0, 9) + a.desc);
      });
      print('TYPE A NUMBER. A LONE PERIOD CANCELS.');
      return;
    }
    // actions level
    var act = S.menu.mod.actions[n - 1];
    if (!act) { print('ERR 0004 NO MENU ITEM "' + t + '".', 'err'); print('TYPE A NUMBER. A LONE PERIOD CANCELS.'); return; }
    S.menu = null;
    startFields(act);
  }

  function startFields(act) {
    S.fields = { act: act, idx: 0, values: [] };
    if (act.fields.length === 0) { finishFields(); return; }
    promptField();
  }

  function promptField() {
    var f = S.fields.act.fields[S.fields.idx];
    var hint = f.boolean ? 'Y/N [N]' : '[' + (f.def || (f.required ? 'REQUIRED' : 'SKIP')) + ']';
    print(f.label + ' ' + hint + ':');
  }

  function fieldInput(text) {
    var f = S.fields.act.fields[S.fields.idx];
    var t = text.trim();
    if (t === '.') { S.fields = null; print('CANCELLED.'); ready(); return; }
    if (t === '' && f.required && !f.def) { print('REQUIRED.'); promptField(); return; }
    S.fields.values.push(t === '' ? (f.def || '') : t);
    S.fields.idx++;
    if (S.fields.idx >= S.fields.act.fields.length) finishFields();
    else promptField();
  }

  function quoteArg(v) {
    v = String(v).replace(/"/g, '');
    return /\s/.test(v) ? '"' + v + '"' : v;
  }

  function finishFields() {
    var act = S.fields.act, vals = S.fields.values;
    S.fields = null;
    var line = act.command;
    act.fields.forEach(function (f, i) {
      var v = vals[i];
      if (f.boolean) {
        if (/^y(es)?$/i.test(v || '')) line += ' --' + f.flag;
        return;
      }
      if (v === undefined || v === '') return;
      if (f.kind === 'flag') line += ' --' + f.flag + ' ' + quoteArg(v);
      else if (f.variadic) line += ' ' + v.split(/\s+/).map(quoteArg).join(' ');
      else line += ' ' + quoteArg(v);
    });
    runLine(line);
  }

  /* ---------------- Input handling ---------------- */
  function submit() {
    var text = inEl.value;
    inEl.value = '';
    moveCursor();
    flushPacing();
    if (S.pending) {
      print('> ' + text, 'echo');
      var p = S.pending;
      S.pending = null;
      if (/^y$/i.test(text.trim())) {
        if (p.kind === 'engine') runLine(p.line, { confirmed: true, noEcho: true });
        else p.onYes();
      } else {
        print('CANCELLED.');
        ready();
      }
      return;
    }
    if (S.fields) { print('> ' + text, 'echo'); fieldInput(text); return; }
    if (S.menu) { print('> ' + text, 'echo'); menuInput(text); return; }
    var t = text.trim();
    if (t === '') { enterMenu(); return; }
    S.history.push(text);
    while (S.history.length > 200) S.history.shift();
    S.histIdx = -1;
    saveUiPrefs();
    runLine(text);
  }

  function saveUiPrefs() {
    Store.saveUi({ history: S.history });
  }

  function moveCursor() {
    // Block cursor tracks the caret using a mirror measurement
    var pos = inEl.selectionStart == null ? inEl.value.length : inEl.selectionStart;
    var mirror = moveCursor._m;
    if (!mirror) {
      mirror = document.createElement('span');
      mirror.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font:inherit;';
      $('inwrap').appendChild(mirror);
      moveCursor._m = mirror;
    }
    mirror.textContent = inEl.value.slice(0, pos);
    cursorEl.style.left = Math.min(mirror.offsetWidth, inEl.offsetWidth - 4) + 'px';
  }

  inEl.addEventListener('input', moveCursor);
  inEl.addEventListener('click', moveCursor);
  inEl.addEventListener('keyup', moveCursor);

  inEl.addEventListener('keydown', function (ev) {
    click();
    var isEnter = ev.key === 'Enter' || ev.key === 'Return' || ev.keyCode === 13;
    if (S.booting) { skipBoot(); if (!isEnter) return; }
    if (pacing || queue.length) flushPacing();
    if (isEnter) { ev.preventDefault(); submit(); return; }
    if (ev.key === 'Escape') {
      ev.preventDefault();
      if (S.pending) { S.pending = null; print('CANCELLED.'); ready(); }
      else if (S.fields) { S.fields = null; print('CANCELLED.'); ready(); }
      else if (S.menu) { S.menu = null; print('MENU CLOSED.'); ready(); }
      return;
    }
    if (ev.key === 'l' && ev.ctrlKey) {
      ev.preventDefault();
      outEl.textContent = '';
      return;
    }
    if (ev.key === 'ArrowUp') {
      ev.preventDefault();
      if (S.history.length === 0) return;
      if (S.histIdx === -1) { S.histDraft = inEl.value; S.histIdx = S.history.length - 1; }
      else if (S.histIdx > 0) S.histIdx--;
      inEl.value = S.history[S.histIdx];
      moveCursor();
      return;
    }
    if (ev.key === 'ArrowDown') {
      ev.preventDefault();
      if (S.histIdx === -1) return;
      S.histIdx++;
      if (S.histIdx >= S.history.length) { S.histIdx = -1; inEl.value = S.histDraft; }
      else inEl.value = S.history[S.histIdx];
      moveCursor();
      return;
    }
    if (ev.key === 'Tab') {
      ev.preventDefault();
      var comp = E.completions(S.doc, inEl.value);
      if (comp.matches.length === 1) {
        var v = inEl.value;
        var cut = comp.current.length ? v.slice(0, v.length - comp.current.length) : v;
        inEl.value = cut + comp.matches[0] + ' ';
        moveCursor();
      } else if (comp.matches.length > 1) {
        print(comp.matches.slice(0, 24).join('  '));
      }
      return;
    }
  });

  // Any keypress or tap during boot/pacing finishes it
  document.addEventListener('keydown', function () {
    if (S.booting) skipBoot();
  });
  outEl.addEventListener('click', function () {
    if (S.booting) skipBoot();
    else if (pacing || queue.length) flushPacing();
    if (!window.getSelection || String(window.getSelection()) === '') focusInput();
  });

  /* ---------------- Boot ---------------- */
  var bootState = null;
  function banner() {
    var d = new Date();
    var p2 = function (n) { return String(n).padStart(2, '0'); };
    var stamp = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) +
      ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
    return [
      "SORRENTO CENTRAL COMPUTING              DOMINION OF MANDA'LOR",
      "SYSTEM " + S.doc.settings.systemName + "   REL " + E.RELEASE + "               HAAT. IJAA. HAA'IT.",
      "IPL COMPLETE  " + stamp,
      "LOGON REQUIRED FOR ENTRY. TYPE LOGON <OPERATOR>"
    ];
  }

  function boot() {
    var lines = [
      'IPL 00A  MIRSH/70 NUCLEUS LOADED',
      'DEVICE 3277 CRT ............ ONLINE',
      'DEVICE 1403 PRINTER ........ ONLINE',
      'DATASET MANDALOR.MASTER .... ' + (Store.available ? (E.docHasData(S.doc) ? 'MOUNTED' : 'EMPTY') : 'NO STORAGE'),
      'SPOOL WRITER ............... STARTED',
      'SYSLOG ..................... ' + S.doc.syslog.length + ' LINES'
    ];
    var i = 0;
    bootState = { done: false };
    function next() {
      if (bootState.done) return;
      if (i < lines.length) {
        addLine(lines[i]);
        i++;
        bootState.timer = setTimeout(next, 220);
      } else {
        finishBoot();
      }
    }
    next();
  }

  function finishBoot() {
    if (!bootState || bootState.done) return;
    bootState.done = true;
    if (bootState.timer) clearTimeout(bootState.timer);
    S.booting = false;
    banner().forEach(function (l) { addLine(l); });
    addLine(S.doc.settings.prompt || 'READY');
    updateHeader();
    focusInput();
  }

  function skipBoot() {
    if (!bootState || bootState.done) return;
    // dump any remaining boot lines instantly, then the banner
    outEl.textContent = '';
    boot._skipped = true;
    var all = [
      'IPL 00A  MIRSH/70 NUCLEUS LOADED',
      'IPL SKIPPED'
    ];
    all.forEach(function (l) { addLine(l); });
    finishBoot();
  }

  /* ---------------- Init ---------------- */
  function init() {
    S.doc = Store.load() || E.newDocument();
    var ui = Store.loadUi();
    S.history = (ui.history || []).slice(-200);
    if (!Store.available) {
      noticeEl.textContent = 'NO LOCAL STORAGE. EXPORT BEFORE LOGOFF.';
    }
    applyDisplay();
    updateHeader();
    boot();
  }

  init();
})();
</script>
</body>
